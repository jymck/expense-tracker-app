<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Expense Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 400px;
    }

    .auth-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 15px;
    }

    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    .password-toggle {
      position: relative;
    }

    .toggle-btn {
      position: absolute;
      right: 12px;
      top: 38px;
      background: none;
      border: none;
      cursor: pointer;
      color: #667eea;
      font-size: 18px;
    }

    .error-message {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 5px;
      display: none;
      padding: 10px;
      background: #fadbd8;
      border-radius: 4px;
    }

    .success-message {
      color: #27ae60;
      font-size: 12px;
      margin-top: 5px;
      display: none;
      padding: 10px;
      background: #d5f4e6;
      border-radius: 4px;
    }

    .info-message {
      color: #1e90ff;
      font-size: 13px;
      padding: 10px;
      background: #e8f4f8;
      border-radius: 4px;
      margin-bottom: 20px;
      border-left: 3px solid #1e90ff;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .form-footer {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }

    .form-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }

    .step-indicator {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      justify-content: center;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .step-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: white;
      background: #ddd;
      font-size: 14px;
    }

    .step.active .step-number {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .step-label {
      font-size: 12px;
      color: #666;
      text-align: center;
    }

    .form-content {
      display: none;
    }

    .form-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <!-- Logo Section -->
      <div class="logo-section">
        <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:1" />
              <stop offset="50%" style="stop-color:#00ff88;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#ff1493;stop-opacity:1" />
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="95" fill="none" stroke="url(#grad1)" stroke-width="3" opacity="0.4"/>
          <circle cx="60" cy="60" r="6" fill="#1e90ff"/>
          <circle cx="140" cy="60" r="6" fill="#00ff88"/>
          <circle cx="100" cy="140" r="6" fill="#ff1493"/>
          <circle cx="100" cy="100" r="10" fill="url(#grad1)"/>
          <line x1="60" y1="60" x2="100" y2="100" stroke="#1e90ff" stroke-width="2" opacity="0.7"/>
          <line x1="140" y1="60" x2="100" y2="100" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
          <line x1="100" y1="140" x2="100" y2="100" stroke="#ff1493" stroke-width="2" opacity="0.7"/>
          <line x1="60" y1="60" x2="140" y2="60" stroke="#1e90ff" stroke-width="2" opacity="0.5"/>
          <text x="35" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#1e90ff">Y</text>
          <text x="90" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#00ff88">C</text>
          <text x="145" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ff1493">R</text>
        </svg>
        <h1>Reset Password</h1>
        <p class="subtitle">Create a new password for your account</p>
      </div>

      <!-- Step Indicator -->
      <div class="step-indicator">
        <div class="step active" id="step1">
          <div class="step-number">1</div>
          <div class="step-label">Verify Token</div>
        </div>
        <div class="step" id="step2">
          <div class="step-number">2</div>
          <div class="step-label">New Password</div>
        </div>
      </div>

      <!-- Step 1: Enter Token -->
      <div id="tokenForm" class="form-content active">
        <div class="info-message">
          Enter the recovery token sent to your email address.
        </div>
        <form onsubmit="handleVerifyToken(event)">
          <div class="form-group">
            <label for="recoveryToken">Recovery Token:</label>
            <input type="text" id="recoveryToken" placeholder="Paste your recovery token" required>
            <div class="error-message" id="tokenError"></div>
          </div>

          <button type="submit" class="btn btn-primary">Verify Token</button>
        </form>

        <div class="form-footer">
          <a onclick="window.location.href='/login.html'">Back to Login</a>
        </div>
      </div>

      <!-- Step 2: Reset Password -->
      <div id="passwordForm" class="form-content">
        <form onsubmit="handleResetPassword(event)">
          <div class="form-group">
            <label>Username:</label>
            <input type="text" id="resetUsername" readonly style="background: #f5f5f5; cursor: not-allowed;">
          </div>

          <div class="form-group">
            <label for="newPassword">New Password:</label>
            <div class="password-toggle">
              <input type="password" id="newPassword" placeholder="Min 6 characters" required>
              <button type="button" class="toggle-btn" onclick="togglePassword('newPassword')">👁️</button>
            </div>
            <div class="error-message" id="passwordError"></div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>
            <div class="password-toggle">
              <input type="password" id="confirmPassword" placeholder="Confirm password" required>
              <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword')">👁️</button>
            </div>
            <div class="error-message" id="confirmError"></div>
          </div>

          <button type="submit" class="btn btn-primary">Reset Password</button>
          <div class="success-message" id="resetSuccess"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    let currentToken = '';

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const btn = event.target;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function showError(elementId, message) {
      const errorEl = document.getElementById(elementId);
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function showSuccess(elementId, message) {
      const successEl = document.getElementById(elementId);
      successEl.textContent = message;
      successEl.style.display = 'block';
    }

    async function handleVerifyToken(event) {
      event.preventDefault();

      const token = document.getElementById('recoveryToken').value;

      try {
        const response = await fetch(`/api/recovery/${token}`);
        const data = await response.json();

        if (!response.ok) {
          showError('tokenError', data.error || 'Invalid token');
          return;
        }

        // Token is valid, move to next step
        currentToken = token;
        document.getElementById('resetUsername').value = data.username;

        // Show step 2
        document.getElementById('tokenForm').classList.remove('active');
        document.getElementById('passwordForm').classList.add('active');
        
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
      } catch (error) {
        showError('tokenError', 'Connection error: ' + error.message);
      }
    }

    async function handleResetPassword(event) {
      event.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');

      // Validation
      if (newPassword !== confirmPassword) {
        showError('confirmError', 'Passwords do not match');
        return;
      }

      if (newPassword.length < 6) {
        showError('passwordError', 'Password must be at least 6 characters');
        return;
      }

      try {
        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: currentToken, password: newPassword })
        });

        const data = await response.json();

        if (!response.ok) {
          showError('passwordError', data.error || 'Failed to reset password');
          return;
        }

        showSuccess('resetSuccess', 'Password reset successfully! Redirecting to login...');
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 2000);
      } catch (error) {
        showError('passwordError', 'Connection error: ' + error.message);
      }
    }

    // Check if token is passed in URL
    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      if (token) {
        document.getElementById('recoveryToken').value = token;
      }
    });
  </script>
</body>
</html>
